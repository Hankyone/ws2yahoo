[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ws2yahoo"
version = "0.1.0"
description = "Mirror your Wealthsimple trades into a Yahoo Finance portfolio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["curl_cffi>=0.7", "websocket-client>=1.6"]
keywords = ["wealthsimple", "yahoo finance", "portfolio", "stocks", "sync"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ws2yahoo = "ws2yahoo.cli:main"

[project.urls]
Homepage = "https://github.com/Hankyone/ws2yahoo"

[tool.setuptools]
packages = ["ws2yahoo"]
